version: 1

integration:
  discovery_transport: agent_reach
  discovery_channel: twitter
  keep_agent_reach_as_thin_collector: true
  host_project_owns_pre_db_gate: true

filters:
  root_post_only: true
  discard_retweets: true
  discard_reply_like_posts: true
  discard_link_stub_posts: true
  discard_external_news_or_brand_broadcast_posts: true
  discard_weak_conversation_posts: true
  require_country_anchor_after_normalization: true
  require_cross_country_seed: true

thresholds:
  min_views_floor: 5000
  weak_conversation_replies_lt: 5
  weak_conversation_quotes_lt: 2

link_stub_phrases:
  - "details here"
  - "read more"
  - "詳細はこちら"
  - "詳しくはこちら"

broadcast_handle_tokens:
  - "news"
  - "times"
  - "official"
  - "media"

conversation_question_terms:
  - "what do you"
  - "what's your"
  - "what is your"
  - "what is one thing"
  - "what do people"
  - "how do you"
  - "which country"
  - "where are you from"
  - "question for"
  - "do you like"
  - "do you have"
  - "what should i"
