version: 5

# NOTE:
# `deep_read_budget` is a legacy field name kept for compatibility with earlier notes.
# In the current root-only policy, this should be read as the budget for `root_refresh`.

defaults:
  channel: twitter
  operation: search
  store_root_posts_only: true
  blocked_topics:
    - politics
    - war
    - religion
    - xenophobia
    - severe_discrimination
  blocked_terms:
    - election
    - government
    - immigration
    - migrant
    - refugee
    - military
    - base
    - protest
    - 基地問題
    - 移民
    - 政治
    - 戦争
    - 歴史
    - 宗教
    - 差別
  pre_db_filters:
    discard_reply_like_posts: true
    discard_link_stub_posts: true
    discard_external_news_or_brand_broadcast_posts: true
    min_views_floor: 5000
  require_country_anchor: true

learning_policy:
  learn_structures_not_themes: true
  keep_negative_findings: true
  stable_promotion_rule:
    min_confirmed_runs: 2
    allow_exceptional_single_run: true

portfolio_targets:
  treat_targets_as_soft_constraints: true
  max_shortlist_share_by_topic_bucket:
    food: 0.25
    daily_life: 0.25
    culture: 0.20
  min_weekly_shortlists_by_topic_bucket:
    infrastructure: 2
    language: 3
    customs: 2
    story: 2
    humor: 2
  batch_rules:
    max_same_topic_bucket: 2
    min_distinct_topic_buckets: 5
    min_distinct_archetypes: 4
    require_frontier_profile: true
    min_non_jp_profiles: 1
    min_local_bridge_profiles: 1
    min_object_anchor_profiles: 1
    max_jp_scoped_share: 0.75
  exploration_mix:
    staple: 0.40
    archetype_expansion: 0.25
    frontier: 0.35
  language_lane_mix:
    en_hub: 0.50
    ja_seed: 0.20
    local_bridge: 0.30
  region_rotation:
    min_weekly_active_clusters: 4
    preferred_clusters:
      - east_asia
      - southeast_asia
      - europe
      - latam
      - anglosphere

family_management:
  dimensions:
    - country_pairs
    - language_lane
    - motif
    - topic_pack
    - risk_tier
    - assembly_mode
  assembly_modes:
    single_post: the post itself already contains the cross-country conversation seed.
    paired_post: editorial value appears mainly after matching two posts.
    hybrid: the post can work alone or become stronger after pairing.
  language_lanes:
    en_hub: English-first discovery for the long-term English-speaking audience.
    ja_seed: Japanese-origin seeds that can still trigger bilingual or bridged discussion in the early phase.
    local_bridge: Local-language probes used mainly to widen country coverage and feed later English editorial use.
  motifs:
    mutual_question: answerable question that gives the target country an easy way to reply.
    local_life_affinity: soft admiration grounded in ordinary routines or shared commonality.
    localization_compare: same product, chain, or format adapted differently across countries.
    slang_wordplay: slang, euphemism, phrase meaning, and word-choice confusion that can become playful discussion.
    price_probe: cost, quantity, or household-price comparison that expands into daily-life differences.
    object_anchor_banter: low-stakes banter tied to a concrete object, phrase, or habit instead of nationality alone.
    self_contained_roll_call: a single post that invites many countries to answer in the same thread.
  topic_packs:
    food_localization: [snack, chain_menu, packaging, convenience, flavor]
    home_costs: [grocery, kitchen, appliance, utilities, household_goods]
    language_play: [slang, phrase, euphemism, pun, word_choice]
    city_service: [transport, queue, toilet, delivery, convenience]
    shared_daily_life: [routine, school, work, neighborhood, hobby]
    low_stakes_humor: [dad_joke, innuendo, slang, toilet_words, silly_debate]
  risk_tiers:
    low: concrete, answerable, and rarely adjacent to politics or grievance.
    medium: useful but needs stronger query anchors and host filtering.
    guarded: only run with explicit review because drift into ideology, mockery, or identity talk is common.
  exclude_packs:
    core_safe: [politics, war, religion, immigration, severe_discrimination]
    affinity_guard: ["proud of your country", "superior culture", "shame culture", "social norms"]
    banter_guard: [foreigner, race, blood, iq, civilized, purity, invasion, colonize]
    language_guard: [history, religion, geopolitics, slur, fandom_war]

